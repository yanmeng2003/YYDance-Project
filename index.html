<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY Dance舞蹈工作室管理系统</title>
  <style>
    :root {
      --primary: #9b59b6;
      --primary-dark: #7d3c98;
      --primary-light: #e8daef;
      --accent: #e91e8c;
      --accent-light: #fce4ec;
      --bg: #faf8fc;
      --card-bg: #ffffff;
      --text: #2d2438;
      --text-muted: #6b5b7a;
      --border: #e8dff0;
      --shadow: 0 4px 20px rgba(155, 89, 182, 0.12);
      --radius: 12px;
      --nav-height: 56px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Navigation */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-height);
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 12px rgba(155, 89, 182, 0.3);
    }

    .navbar-brand {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .navbar-nav {
      display: flex;
      gap: 8px;
    }

    .nav-link {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 0.875rem;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.2s;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Main container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Home page */
    .hero {
      text-align: center;
      padding: 32px 16px 40px;
    }

    .hero h1 {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      color: var(--primary-dark);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 8px;
    }

    .entry-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .entry-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .entry-card:hover:not(.disabled) {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(155, 89, 182, 0.2);
    }

    .entry-card.disabled {
      cursor: not-allowed;
      opacity: 0.75;
    }

    .entry-card.disabled::before {
      background: #ccc;
    }

    .card-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .entry-card:not(.disabled) .card-icon {
      background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
    }

    .entry-card.disabled .card-icon {
      background: #f0f0f0;
    }

    .entry-card h2 {
      font-size: 1.15rem;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .entry-card p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .badge-soon {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 12px;
      background: #f5f5f5;
      color: #888;
      font-size: 0.75rem;
      border-radius: 20px;
      font-weight: 500;
    }

    /* Students page */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .page-header h2 {
      font-size: 1.35rem;
      color: var(--primary-dark);
      flex: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary-light);
    }

    .btn-danger {
      background: transparent;
      color: #c0392b;
      border: 1px solid #e8b4b0;
    }

    .btn-danger:hover {
      background: #fdf2f2;
      border-color: #c0392b;
    }

    .form-actions-edit {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-actions-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .form-actions-delete {
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.15);
    }

    .form-actions {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Student list */
    .list-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .list-card h3 {
      font-size: 1rem;
      color: var(--primary-dark);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .student-count {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: normal;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .hours-badge {
      display: inline-block;
      padding: 4px 10px;
      background: linear-gradient(135deg, var(--primary-light), var(--accent-light));
      color: var(--primary-dark);
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .student-list {
      list-style: none;
    }

    .student-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .student-list-item:last-child {
      border-bottom: none;
    }

    .student-list-item:hover {
      background: rgba(232, 218, 239, 0.25);
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 8px;
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .student-name {
      font-weight: 600;
      color: var(--primary-dark);
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* FAB */
    .fab {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 150;
      padding: 14px 20px;
      border: none;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(155, 89, 182, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .fab.visible {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .fab:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(155, 89, 182, 0.5);
    }

    .fab:active {
      transform: scale(0.98);
    }

    .fab.fab-icon {
      width: 56px;
      height: 56px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.75rem;
      line-height: 1;
      justify-content: center;
    }

    .weekday-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .weekday-options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text);
      font-weight: normal;
      cursor: pointer;
    }

    .weekday-options input {
      width: auto;
      accent-color: var(--primary);
    }

    .course-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .course-meta .sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .course-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(45, 36, 56, 0.45);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 12px 40px rgba(155, 89, 182, 0.25);
      border: 1px solid var(--border);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 0;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: var(--primary-dark);
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border: none;
      background: var(--bg);
      border-radius: 50%;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .modal-close:hover {
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .modal-body {
      padding: 20px 24px 24px;
    }

    .modal-body .form-grid {
      grid-template-columns: 1fr;
    }

    @media (max-width: 640px) {
      .navbar-brand {
        font-size: 0.9rem;
      }

      .fab {
        right: 16px;
        bottom: 20px;
      }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--primary-dark);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="navbar-brand">YY Dance舞蹈工作室</span>
    <div class="navbar-nav">
      <button type="button" class="nav-link active" data-page="home">首页</button>
      <button type="button" class="nav-link" data-page="students">学员管理</button>
      <button type="button" class="nav-link" data-page="courses">课程管理</button>
    </div>
  </nav>

  <main class="container">
    <!-- 首页 -->
    <section id="page-home" class="page active">
      <div class="hero">
        <h1>YY Dance舞蹈工作室管理系统</h1>
        <p>专业、高效的舞蹈工作室运营管理</p>
      </div>
      <div class="cards-grid">
        <div class="entry-card" id="card-students" role="button" tabindex="0">
          <div class="card-icon">👤</div>
          <h2>学员管理</h2>
          <p>添加学员、查看剩余课时</p>
        </div>
        <div class="entry-card" id="card-courses" role="button" tabindex="0">
          <div class="card-icon">📅</div>
          <h2>课程管理</h2>
          <p>创建课程、查看上课时间</p>
        </div>
      </div>
    </section>

    <!-- 学员管理页 -->
    <section id="page-students" class="page">
      <div class="page-header">
        <button type="button" class="btn btn-outline" id="btn-back-home">← 返回首页</button>
        <h2>学员管理</h2>
      </div>

      <div class="list-card">
        <h3>
          学员列表
          <span class="student-count" id="student-count">共 0 人</span>
        </h3>
        <div id="empty-state" class="empty-state">
          <div class="icon">📋</div>
          <p>暂无学员，点击右下角添加</p>
        </div>
        <ul class="student-list" id="student-list"></ul>
      </div>
    </section>

    <!-- 课程管理页 -->
    <section id="page-courses" class="page">
      <div class="page-header">
        <button type="button" class="btn btn-outline" id="btn-back-home-courses">← 返回首页</button>
        <h2>课程管理</h2>
      </div>

      <div class="list-card">
        <h3>
          课程列表
          <span class="student-count" id="course-count">共 0 门</span>
        </h3>
        <div id="course-empty-state" class="empty-state">
          <div class="icon">📅</div>
          <p>暂无课程，点击右下角添加</p>
        </div>
        <ul class="student-list" id="course-list"></ul>
      </div>
    </section>
  </main>

  <button type="button" class="fab" id="fab-add-student" aria-label="添加学员">+ 添加学员</button>
  <button type="button" class="fab fab-icon" id="fab-add-course" aria-label="添加课程">+</button>

  <!-- 添加学员弹窗 -->
  <div class="modal-overlay" id="modal-add" role="dialog" aria-modal="true" aria-labelledby="modal-add-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-add-title">添加学员</h3>
        <button type="button" class="modal-close" data-close="modal-add" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-add-student">
          <div class="form-grid">
            <div class="form-group">
              <label for="add-name">姓名 *</label>
              <input type="text" id="add-name" required placeholder="请输入姓名">
            </div>
            <div class="form-group">
              <label for="add-phone">联系电话 *</label>
              <input type="tel" id="add-phone" required placeholder="请输入手机号">
            </div>
            <div class="form-group">
              <label for="add-wechat">微信号</label>
              <input type="text" id="add-wechat" placeholder="选填">
            </div>
            <div class="form-group">
              <label for="add-hours">购买课时数 *</label>
              <input type="number" id="add-hours" required min="1" step="1" placeholder="例如：10">
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">添加学员</button>
            <button type="button" class="btn btn-outline" data-close="modal-add">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 添加课程弹窗 -->
  <div class="modal-overlay" id="modal-add-course" role="dialog" aria-modal="true" aria-labelledby="modal-add-course-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-add-course-title">添加课程</h3>
        <button type="button" class="modal-close" data-close="modal-add-course" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-add-course">
          <div class="form-grid">
            <div class="form-group">
              <label for="course-name">课程名称 *</label>
              <input type="text" id="course-name" required placeholder="例如：爵士舞基础班">
            </div>
            <div class="form-group">
              <label>星期几 *</label>
              <div class="weekday-options" id="course-weekdays">
                <label><input type="checkbox" name="weekday" value="周一">周一</label>
                <label><input type="checkbox" name="weekday" value="周二">周二</label>
                <label><input type="checkbox" name="weekday" value="周三">周三</label>
                <label><input type="checkbox" name="weekday" value="周四">周四</label>
                <label><input type="checkbox" name="weekday" value="周五">周五</label>
                <label><input type="checkbox" name="weekday" value="周六">周六</label>
                <label><input type="checkbox" name="weekday" value="周日">周日</label>
              </div>
            </div>
            <div class="form-group">
              <label for="course-start-time">开始时间 *</label>
              <input type="time" id="course-start-time" required>
            </div>
            <div class="form-group">
              <label for="course-end-time">结束时间 *</label>
              <input type="time" id="course-end-time" required>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">添加课程</button>
            <button type="button" class="btn btn-outline" data-close="modal-add-course">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 编辑课程弹窗 -->
  <div class="modal-overlay" id="modal-edit-course" role="dialog" aria-modal="true" aria-labelledby="modal-edit-course-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-edit-course-title">编辑课程</h3>
        <button type="button" class="modal-close" data-close="modal-edit-course" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-edit-course">
          <input type="hidden" id="edit-course-id">
          <div class="form-grid">
            <div class="form-group">
              <label for="edit-course-name">课程名称 *</label>
              <input type="text" id="edit-course-name" required placeholder="例如：爵士舞基础班">
            </div>
            <div class="form-group">
              <label>星期几 *</label>
              <div class="weekday-options" id="edit-course-weekdays">
                <label><input type="checkbox" name="weekday" value="周一">周一</label>
                <label><input type="checkbox" name="weekday" value="周二">周二</label>
                <label><input type="checkbox" name="weekday" value="周三">周三</label>
                <label><input type="checkbox" name="weekday" value="周四">周四</label>
                <label><input type="checkbox" name="weekday" value="周五">周五</label>
                <label><input type="checkbox" name="weekday" value="周六">周六</label>
                <label><input type="checkbox" name="weekday" value="周日">周日</label>
              </div>
            </div>
            <div class="form-group">
              <label for="edit-course-start-time">开始时间 *</label>
              <input type="time" id="edit-course-start-time" required>
            </div>
            <div class="form-group">
              <label for="edit-course-end-time">结束时间 *</label>
              <input type="time" id="edit-course-end-time" required>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <button type="button" class="btn btn-outline" data-close="modal-edit-course">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 编辑学员弹窗 -->
  <div class="modal-overlay" id="modal-edit" role="dialog" aria-modal="true" aria-labelledby="modal-edit-title">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-edit-title">编辑学员</h3>
        <button type="button" class="modal-close" data-close="modal-edit" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <form id="form-edit-student">
          <input type="hidden" id="edit-id">
          <div class="form-grid">
            <div class="form-group">
              <label for="edit-name">姓名 *</label>
              <input type="text" id="edit-name" required placeholder="请输入姓名">
            </div>
            <div class="form-group">
              <label for="edit-phone">联系电话 *</label>
              <input type="tel" id="edit-phone" required placeholder="请输入手机号">
            </div>
            <div class="form-group">
              <label for="edit-wechat">微信号</label>
              <input type="text" id="edit-wechat" placeholder="选填">
            </div>
            <div class="form-group">
              <label for="edit-hours">剩余课时数 *</label>
              <input type="number" id="edit-hours" required min="0" step="1" placeholder="例如：10">
            </div>
          </div>
          <div class="form-actions-edit">
            <div class="form-actions-row">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn btn-outline" data-close="modal-edit">取消</button>
            </div>
            <div class="form-actions-delete">
              <button type="button" class="btn btn-danger" id="btn-delete-student">删除学员</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://dcjqllqpzihbjjoytrzt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjanFsbHFwemloYmpqb3l0cnp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MzE0ODAsImV4cCI6MjA5NTMwNzQ4MH0.EACmM5pQlZ2K-EaM-S5lmM91Uq5aL5Q_tIMRJmcaf30';

    const WEEKDAY_ORDER = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

    let supabaseClient = null;
    let studentsCache = [];
    let coursesCache = [];

    function initSupabaseClient() {
      const lib = window.supabase || globalThis.supabase;
      if (!lib) return null;
      if (typeof lib.createClient === 'function') {
        return lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return null;
    }

    function getSupabase() {
      if (!supabaseClient) {
        supabaseClient = initSupabaseClient();
      }
      return supabaseClient;
    }

    function mapStudent(row) {
      return {
        id: row.id,
        name: row.name,
        phone: row.phone,
        wechat: row.wechat || '',
        remainingHours: row.remaining_lessons,
        totalLessons: row.total_lessons
      };
    }

    async function fetchStudents() {
      const db = getSupabase();
      if (!db) throw new Error('Supabase 库未加载，请检查网络后刷新页面');

      const { data, error } = await db
        .from('students')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;
      return (data || []).map(mapStudent);
    }

    async function isPhoneTaken(phone, excludeId) {
      const db = getSupabase();
      if (!db) throw new Error('Supabase 库未加载');

      let query = db
        .from('students')
        .select('id')
        .eq('phone', phone);

      if (excludeId) {
        query = query.neq('id', excludeId);
      }

      const { data, error } = await query.limit(1);
      if (error) throw error;
      return data && data.length > 0;
    }

    function mapCourse(row) {
      return {
        id: row.id,
        name: row.name,
        weekdays: row.weekdays || [],
        startTime: row.start_time,
        endTime: row.end_time
      };
    }

    async function fetchCourses() {
      const db = getSupabase();
      if (!db) throw new Error('Supabase 库未加载，请检查网络后刷新页面');

      const { data, error } = await db
        .from('courses')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;
      return (data || []).map(mapCourse);
    }

    function formatTime(timeStr) {
      if (!timeStr) return '';
      return String(timeStr).slice(0, 5);
    }

    function formatTimeRange(start, end) {
      return formatTime(start) + ' - ' + formatTime(end);
    }

    function formatWeekdays(days) {
      if (!days || !days.length) return '—';
      return [...days].sort((a, b) => WEEKDAY_ORDER.indexOf(a) - WEEKDAY_ORDER.indexOf(b)).join('、');
    }

    function getSelectedWeekdays(containerId) {
      return Array.from(document.querySelectorAll(containerId + ' input[name="weekday"]:checked'))
        .map(el => el.value);
    }

    function setWeekdayCheckboxes(containerId, days) {
      document.querySelectorAll(containerId + ' input[name="weekday"]').forEach(cb => {
        cb.checked = days.includes(cb.value);
      });
    }

    function validateCourseTimes(startTime, endTime) {
      if (!startTime || !endTime) return false;
      return startTime < endTime;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function openModal(id) {
      document.getElementById(id).classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
      if (!document.querySelector('.modal-overlay.open')) {
        document.body.style.overflow = '';
      }
    }

    function closeAllModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('open'));
      document.body.style.overflow = '';
    }

    function updateFabVisibility(page) {
      document.getElementById('fab-add-student').classList.toggle('visible', page === 'students');
      document.getElementById('fab-add-course').classList.toggle('visible', page === 'courses');
    }

    function navigateTo(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.page === page);
      });
      updateFabVisibility(page);
      if (page !== 'students' && page !== 'courses') {
        closeAllModals();
      }
      if (page === 'students') {
        loadAndRenderStudents();
      }
      if (page === 'courses') {
        loadAndRenderCourses();
      }
    }

    function renderStudentListUI(students) {
      const countEl = document.getElementById('student-count');
      const emptyEl = document.getElementById('empty-state');
      const listEl = document.getElementById('student-list');

      countEl.textContent = '共 ' + students.length + ' 人';

      if (students.length === 0) {
        emptyEl.style.display = 'block';
        listEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      listEl.style.display = 'block';

      listEl.innerHTML = students.map(s => `
        <li class="student-list-item">
          <div class="student-info">
            <span class="student-name">${escapeHtml(s.name)}</span>
            <span class="hours-badge">${s.remainingHours} 课时</span>
          </div>
          <button type="button" class="btn btn-outline btn-sm btn-edit" data-id="${escapeHtml(s.id)}">编辑</button>
        </li>
      `).join('');

      listEl.querySelectorAll('.btn-edit').forEach(btn => {
        btn.addEventListener('click', () => openEditModal(btn.dataset.id));
      });
    }

    async function loadAndRenderStudents() {
      try {
        studentsCache = await fetchStudents();
        renderStudentListUI(studentsCache);
      } catch (err) {
        console.error(err);
        showToast('加载学员失败，请检查网络或数据库配置');
      }
    }

    function renderCourseListUI(courses) {
      const countEl = document.getElementById('course-count');
      const emptyEl = document.getElementById('course-empty-state');
      const listEl = document.getElementById('course-list');

      countEl.textContent = '共 ' + courses.length + ' 门';

      if (courses.length === 0) {
        emptyEl.style.display = 'block';
        listEl.style.display = 'none';
        return;
      }

      emptyEl.style.display = 'none';
      listEl.style.display = 'block';

      listEl.innerHTML = courses.map(c => `
        <li class="student-list-item">
          <div class="course-meta">
            <span class="student-name">${escapeHtml(c.name)}</span>
            <span class="sub">${escapeHtml(formatTimeRange(c.startTime, c.endTime))}</span>
            <span class="sub">上课日期：${escapeHtml(formatWeekdays(c.weekdays))}</span>
          </div>
          <div class="course-actions">
            <button type="button" class="btn btn-outline btn-sm btn-edit-course" data-id="${escapeHtml(c.id)}">编辑</button>
            <button type="button" class="btn btn-outline btn-sm btn-delete-course" data-id="${escapeHtml(c.id)}">删除</button>
          </div>
        </li>
      `).join('');

      listEl.querySelectorAll('.btn-edit-course').forEach(btn => {
        btn.addEventListener('click', () => openEditCourseModal(btn.dataset.id));
      });

      listEl.querySelectorAll('.btn-delete-course').forEach(btn => {
        btn.addEventListener('click', () => deleteCourse(btn.dataset.id));
      });
    }

    async function loadAndRenderCourses() {
      try {
        coursesCache = await fetchCourses();
        renderCourseListUI(coursesCache);
      } catch (err) {
        console.error(err);
        showToast('加载课程失败，请检查网络或数据库配置');
      }
    }

    function openEditCourseModal(id) {
      const course = coursesCache.find(c => c.id === id);
      if (!course) return;

      document.getElementById('edit-course-id').value = course.id;
      document.getElementById('edit-course-name').value = course.name;
      setWeekdayCheckboxes('#edit-course-weekdays', course.weekdays);
      document.getElementById('edit-course-start-time').value = formatTime(course.startTime);
      document.getElementById('edit-course-end-time').value = formatTime(course.endTime);

      openModal('modal-edit-course');
    }

    function openEditModal(id) {
      const student = studentsCache.find(s => s.id === id);
      if (!student) return;

      document.getElementById('edit-id').value = student.id;
      document.getElementById('edit-name').value = student.name;
      document.getElementById('edit-phone').value = student.phone;
      document.getElementById('edit-wechat').value = student.wechat || '';
      document.getElementById('edit-hours').value = student.remainingHours;

      openModal('modal-edit');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function bindEvents() {
      document.getElementById('card-students').addEventListener('click', () => navigateTo('students'));
      document.getElementById('card-students').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          navigateTo('students');
        }
      });

      document.getElementById('card-courses').addEventListener('click', () => navigateTo('courses'));
      document.getElementById('card-courses').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          navigateTo('courses');
        }
      });

      document.getElementById('btn-back-home').addEventListener('click', () => navigateTo('home'));
      document.getElementById('btn-back-home-courses').addEventListener('click', () => navigateTo('home'));

      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          const page = link.dataset.page;
          if (page === 'students' || page === 'home' || page === 'courses') {
            navigateTo(page);
          }
        });
      });

      document.getElementById('fab-add-student').addEventListener('click', () => {
        document.getElementById('form-add-student').reset();
        openModal('modal-add');
      });

      document.getElementById('fab-add-course').addEventListener('click', () => {
        document.getElementById('form-add-course').reset();
        openModal('modal-add-course');
      });

      document.querySelectorAll('[data-close]').forEach(el => {
        el.addEventListener('click', () => closeModal(el.dataset.close));
      });

      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeModal(overlay.id);
        });
      });

      document.getElementById('form-add-student').addEventListener('submit', onAddStudent);
      document.getElementById('form-edit-student').addEventListener('submit', onEditStudent);
      document.getElementById('btn-delete-student').addEventListener('click', onDeleteStudent);
      document.getElementById('form-add-course').addEventListener('submit', onAddCourse);
      document.getElementById('form-edit-course').addEventListener('submit', onEditCourse);
    }

    async function onAddCourse(e) {
      e.preventDefault();

      const name = document.getElementById('course-name').value.trim();
      const weekdays = getSelectedWeekdays('#course-weekdays');
      const startTime = document.getElementById('course-start-time').value;
      const endTime = document.getElementById('course-end-time').value;

      if (!name) {
        showToast('请填写课程名称');
        return;
      }

      if (weekdays.length === 0) {
        showToast('请至少选择一个星期');
        return;
      }

      if (!validateCourseTimes(startTime, endTime)) {
        showToast('请填写有效的开始与结束时间，且结束时间须晚于开始时间');
        return;
      }

      try {
        const db = getSupabase();
        if (!db) {
          showToast('Supabase 库未加载，请刷新页面');
          return;
        }

        const { error } = await db.from('courses').insert({
          name,
          weekdays,
          start_time: startTime,
          end_time: endTime
        });

        if (error) throw error;

        e.target.reset();
        closeModal('modal-add-course');
        await loadAndRenderCourses();
        showToast('课程添加成功');
      } catch (err) {
        console.error(err);
        showToast(err.message || '添加失败');
      }
    }

    async function onEditCourse(e) {
      e.preventDefault();

      const id = document.getElementById('edit-course-id').value;
      const name = document.getElementById('edit-course-name').value.trim();
      const weekdays = getSelectedWeekdays('#edit-course-weekdays');
      const startTime = document.getElementById('edit-course-start-time').value;
      const endTime = document.getElementById('edit-course-end-time').value;

      if (!name) {
        showToast('请填写课程名称');
        return;
      }

      if (weekdays.length === 0) {
        showToast('请至少选择一个星期');
        return;
      }

      if (!validateCourseTimes(startTime, endTime)) {
        showToast('请填写有效的开始与结束时间，且结束时间须晚于开始时间');
        return;
      }

      try {
        const db = getSupabase();
        if (!db) {
          showToast('Supabase 库未加载，请刷新页面');
          return;
        }

        const { error } = await db.from('courses').update({
          name,
          weekdays,
          start_time: startTime,
          end_time: endTime
        }).eq('id', id);

        if (error) throw error;

        closeModal('modal-edit-course');
        await loadAndRenderCourses();
        showToast('保存成功');
      } catch (err) {
        console.error(err);
        showToast(err.message || '保存失败');
      }
    }

    async function deleteCourse(id) {
      const course = coursesCache.find(c => c.id === id);
      const name = course ? course.name : '该课程';

      if (!confirm('确定要删除「' + name + '」吗？此操作不可恢复。')) {
        return;
      }

      try {
        const db = getSupabase();
        if (!db) {
          showToast('Supabase 库未加载，请刷新页面');
          return;
        }

        const { error } = await db.from('courses').delete().eq('id', id);
        if (error) throw error;

        await loadAndRenderCourses();
        showToast('课程已删除');
      } catch (err) {
        console.error(err);
        showToast(err.message || '删除失败');
      }
    }

    async function onAddStudent(e) {
      e.preventDefault();

      const name = document.getElementById('add-name').value.trim();
      const phone = document.getElementById('add-phone').value.trim();
      const wechat = document.getElementById('add-wechat').value.trim();
      const hours = parseInt(document.getElementById('add-hours').value, 10);

      if (!name || !phone) {
        showToast('请填写姓名和联系电话');
        return;
      }

      if (!hours || hours < 1) {
        showToast('购买课时数须为正整数');
        return;
      }

      try {
        if (await isPhoneTaken(phone)) {
          showToast('该联系电话已存在');
          return;
        }

        const db = getSupabase();
        if (!db) {
          showToast('Supabase 库未加载，请刷新页面');
          return;
        }

        const { error } = await db.from('students').insert({
          name,
          phone,
          wechat: wechat || null,
          total_lessons: hours,
          remaining_lessons: hours
        });

        if (error) throw error;

        e.target.reset();
        closeModal('modal-add');
        await loadAndRenderStudents();
        showToast('学员添加成功');
      } catch (err) {
        console.error(err);
        showToast(err.message || '添加失败');
      }
    }

    async function onEditStudent(e) {
      e.preventDefault();

      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim();
      const phone = document.getElementById('edit-phone').value.trim();
      const wechat = document.getElementById('edit-wechat').value.trim();
      const hours = parseInt(document.getElementById('edit-hours').value, 10);

      if (!name || !phone) {
        showToast('请填写姓名和联系电话');
        return;
      }

      if (isNaN(hours) || hours < 0) {
        showToast('课时数须为不小于 0 的整数');
        return;
      }

      try {
        if (await isPhoneTaken(phone, id)) {
          showToast('该联系电话已被其他学员使用');
          return;
        }

        const db = getSupabase();
        if (!db) {
          showToast('Supabase 库未加载，请刷新页面');
          return;
        }

        const { error } = await db.from('students').update({
          name,
          phone,
          wechat: wechat || null,
          remaining_lessons: hours
        }).eq('id', id);

        if (error) throw error;

        closeModal('modal-edit');
        await loadAndRenderStudents();
        showToast('保存成功');
      } catch (err) {
        console.error(err);
        showToast(err.message || '保存失败');
      }
    }

    async function onDeleteStudent() {
      const id = document.getElementById('edit-id').value;
      const name = document.getElementById('edit-name').value.trim() || '该学员';

      if (!id) return;

      if (!confirm('确定要删除「' + name + '」吗？此操作不可恢复。')) {
        return;
      }

      try {
        const db = getSupabase();
        if (!db) {
          showToast('Supabase 库未加载，请刷新页面');
          return;
        }

        const { error } = await db.from('students').delete().eq('id', id);
        if (error) throw error;

        closeModal('modal-edit');
        await loadAndRenderStudents();
        showToast('学员已删除');
      } catch (err) {
        console.error(err);
        showToast(err.message || '删除失败');
      }
    }

    function initApp() {
      bindEvents();
      updateFabVisibility('home');
      if (getSupabase()) {
        loadAndRenderStudents();
      } else {
        console.warn('Supabase JS 未就绪，页面导航仍可用，数据功能需刷新后重试');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
